services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: tonezen-postgres-internal
      POSTGRES_DB: ${POSTGRES_DB:-tonezen}
    volumes:
      - tonezen-postgres:/var/lib/postgresql/data
      - ./backend/supabase/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.151.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${TONEZEN_BASE_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:tonezen-postgres-internal@db:5432/${POSTGRES_DB:-tonezen}?search_path=auth
      GOTRUE_SITE_URL: ${TONEZEN_BASE_URL:-http://localhost:8000}
      GOTRUE_URI_ALLOW_LIST: ${GOTRUE_URI_ALLOW_LIST:-}
      GOTRUE_DISABLE_SIGNUP: ${GOTRUE_DISABLE_SIGNUP:-false}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      # Dev: allow desktop + Android to refresh without invalidating each other's token.
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: admin@tonezen.local
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 2500
      GOTRUE_SMTP_SENDER_NAME: Tonezen

  bootstrap:
    image: alpine:3.20
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      AUTH_INTERNAL_URL: http://auth:9999
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@tonezen.local}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-tonezen}
      PGPASSWORD: tonezen-postgres-internal
    command:
      - sh
      - -ec
      - |
        apk add --no-cache postgresql-client curl jq >/dev/null
        for i in $(seq 1 60); do
          psql -h db -U supabase_admin -d "$$POSTGRES_DB" -c "INSERT INTO auth.schema_migrations (version) SELECT '20221208132122' WHERE EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'auth' AND table_name = 'schema_migrations') ON CONFLICT DO NOTHING;" >/dev/null 2>&1 && break
          sleep 2
        done
        for i in $(seq 1 60); do
          curl -sf "$$AUTH_INTERNAL_URL/health" >/dev/null && break
          sleep 2
        done
        users=$$(curl -sf -H "Authorization: Bearer $$SERVICE_ROLE_KEY" -H "apikey: $$SERVICE_ROLE_KEY" "$$AUTH_INTERNAL_URL/admin/users?page=1&per_page=200")
        if echo "$$users" | jq -e --arg email "$$ADMIN_EMAIL" '.users[] | select(.email == $$email)' >/dev/null; then
          echo "Admin user already exists: $$ADMIN_EMAIL"
          exit 0
        fi
        jq -n --arg email "$$ADMIN_EMAIL" --arg password "$$ADMIN_PASSWORD" --arg name "$$ADMIN_DISPLAY_NAME" \
          '{email: $$email, password: $$password, email_confirm: true, user_metadata: {role: "admin", full_name: $$name}}' \
          | curl -sf -X POST -H "Authorization: Bearer $$SERVICE_ROLE_KEY" -H "apikey: $$SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" -d @- "$$AUTH_INTERNAL_URL/admin/users"
        echo "Created admin user: $$ADMIN_EMAIL"

  storage-bootstrap:
    image: node:20-alpine
    restart: "no"
    depends_on:
      storage:
        condition: service_started
    environment:
      STORAGE_URL: http://storage:5000
      STORAGE_BUCKET: content
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./docker/storage-bootstrap/seed-storage-layout.mjs:/app/seed-storage-layout.mjs:ro
    command: ["node", "/app/seed-storage-layout.mjs"]

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:tonezen-postgres-internal@db:5432/${POSTGRES_DB:-tonezen}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_EXTRA_SEARCH_PATH: public

  meta:
    image: supabase/postgres-meta:v0.84.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-tonezen}
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: tonezen-postgres-internal
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  studio:
    image: supabase/studio:20250224-d10db0f
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tonezen}
      POSTGRES_PASSWORD: tonezen-postgres-internal
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${TONEZEN_BASE_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_NAME:-Tonezen}
      DEFAULT_PROJECT_NAME: ${STUDIO_NAME:-Tonezen}

  realtime:
    container_name: realtime-dev.supabase-realtime
    image: supabase/realtime:v2.34.47
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: tonezen-postgres-internal
      DB_NAME: ${POSTGRES_DB:-tonezen}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  storage:
    image: supabase/storage-api:v1.29.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
      imgproxy:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:tonezen-postgres-internal@db:5432/${POSTGRES_DB:-tonezen}
      STORAGE_PUBLIC_URL: ${TONEZEN_BASE_URL:-http://localhost:8000}
      FILE_SIZE_LIMIT: 524288000
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET in .env}
      GLOBAL_S3_ENDPOINT: ${S3_ENDPOINT:?Set S3_ENDPOINT in .env}
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}
      # Beget and other S3-compatible providers reject AWS SDK default checksums (TUS uploads fail with XAmzContentSHA256Mismatch).
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
      REGION: ${S3_REGION:-ru1}
      TUS_ALLOW_S3_TAGS: "false"
      TENANT_ID: tonezen
      ENABLE_IMAGE_TRANSFORMATION: "false"
      IMGPROXY_URL: http://imgproxy:5001

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"

  api:
    build:
      context: ./backend/api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://supabase_admin:tonezen-postgres-internal@db:5432/${POSTGRES_DB:-tonezen}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      STORAGE_INTERNAL_URL: http://storage:5000
      TONEZEN_BASE_URL: ${TONEZEN_BASE_URL:-http://localhost:8000}
      PORT: 3001

  landing:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/landing/public:/usr/share/nginx/html:ro

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - api
      - landing
      - realtime
      - storage
      - studio
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env (node scripts/gen-env.mjs)}
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"
    volumes:
      - ./docker/kong/kong.yml:/home/kong/temp.yml:ro
      - ./docker/kong/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    entrypoint: ["sh", "/home/kong/kong-entrypoint.sh"]

  indexer:
    build:
      context: ./backend/indexer
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      DATABASE_URL: postgres://supabase_admin:tonezen-postgres-internal@db:5432/${POSTGRES_DB:-tonezen}
      STORAGE_URL: http://storage:5000
      STORAGE_BUCKET: content
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      INDEXER_INTERVAL_SECONDS: 60

  mail:
    image: inbucket/inbucket:3.0.3
    restart: unless-stopped

volumes:
  tonezen-postgres:
    name: tonezen-postgres
