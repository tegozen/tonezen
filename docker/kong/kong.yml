_format_version: "2.1"
_transform: true

consumers:
  - username: DASHBOARD

basicauth_credentials:
  - consumer: DASHBOARD
    username: '$DASHBOARD_USERNAME'
    password: '$DASHBOARD_PASSWORD'

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth
        strip_path: true
        paths:
          - /auth/v1

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest
        strip_path: true
        paths:
          - /rest/v1

  - name: api-v1
    url: http://api:3001/
    routes:
      - name: api
        strip_path: true
        paths:
          - /api/v1

  - name: storage-v1
    url: http://storage-path-proxy:5050/
    routes:
      - name: storage
        strip_path: true
        paths:
          - /storage/v1
    plugins:
      - name: cors
        config:
          origins:
            - "$TONEZEN_BASE_URL"
          methods:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-upsert
            - tus-resumable
            - upload-length
            - upload-offset
            - upload-metadata
            - cache-control
            - x-amz-content-sha256
          exposed_headers:
            - Location
            - tus-resumable
            - upload-offset
            - upload-length
            - upload-metadata
            - upload-expires
          credentials: false

  # TUS resumable uploads: storage returns Location without /storage/v1 prefix
  - name: storage-tus
    url: http://storage-path-proxy:5050/
    routes:
      - name: storage-tus-all
        strip_path: false
        regex_priority: 10
        paths:
          - /upload/
    plugins:
      - name: cors
        config:
          origins:
            - "$TONEZEN_BASE_URL"
          methods:
            - GET
            - HEAD
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - apikey
            - x-client-info
            - x-upsert
            - tus-resumable
            - upload-length
            - upload-offset
            - upload-metadata
            - cache-control
            - x-amz-content-sha256
          exposed_headers:
            - Location
            - tus-resumable
            - upload-offset
            - upload-length
            - upload-metadata
            - upload-expires
          credentials: false

  - name: realtime-v1-ws
    url: http://realtime-dev.supabase-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-ws
        strip_path: true
        paths:
          - /realtime/v1/

  - name: realtime-v1-rest
    url: http://realtime-dev.supabase-realtime:4000/api
    routes:
      - name: realtime-rest
        strip_path: true
        paths:
          - /realtime/v1/api

  - name: landing
    url: http://landing:80/
    routes:
      - name: landing-favicon
        strip_path: false
        paths:
          - /favicon.ico
          - /favicon.png
      - name: landing-root
        strip_path: false
        paths:
          - /
    plugins:
      - name: cors

  - name: studio
    url: http://studio:3000/
    routes:
      - name: studio-entry
        strip_path: true
        paths:
          - /studio
      - name: studio-next
        strip_path: false
        paths:
          - /_next
      - name: studio-favicon
        strip_path: false
        paths:
          - /favicon
      - name: studio-img
        strip_path: false
        paths:
          - /img
      - name: studio-monaco
        strip_path: false
        paths:
          - /monaco-editor
      - name: studio-project
        strip_path: false
        paths:
          - /project
      - name: studio-projects
        strip_path: false
        paths:
          - /projects
      - name: studio-platform
        strip_path: false
        paths:
          - /platform
      - name: studio-account
        strip_path: false
        paths:
          - /account
      - name: studio-api
        strip_path: false
        paths:
          - /api
    plugins:
      - name: cors
      - name: basic-auth
        config:
          hide_credentials: true

plugins:
  - name: cors
    config:
      origins:
        - "$TONEZEN_BASE_URL"
      methods:
        - GET
        - HEAD
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - apikey
        - x-client-info
        - x-upsert
        - tus-resumable
        - upload-length
        - upload-offset
        - upload-metadata
        - cache-control
        - x-amz-content-sha256
      exposed_headers:
        - Location
        - tus-resumable
        - upload-offset
        - upload-length
        - upload-metadata
        - upload-expires
      credentials: false
