_format_version: "2.1"
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth
        strip_path: true
        paths:
          - /auth/v1

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest
        strip_path: true
        paths:
          - /rest/v1

  - name: api-v1
    url: http://api:3001/
    routes:
      - name: api
        strip_path: true
        paths:
          - /api/v1

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - apikey
      credentials: true
