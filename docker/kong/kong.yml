_format_version: "2.1"
_transform: true

consumers:
  - username: DASHBOARD

basicauth_credentials:
  - consumer: DASHBOARD
    username: '$DASHBOARD_USERNAME'
    password: '$DASHBOARD_PASSWORD'

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth
        strip_path: true
        paths:
          - /auth/v1

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest
        strip_path: true
        paths:
          - /rest/v1

  - name: api-v1
    url: http://api:3001/
    routes:
      - name: api
        strip_path: true
        paths:
          - /api/v1

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage
        strip_path: true
        paths:
          - /storage/v1

  - name: realtime-v1-ws
    url: http://realtime-dev.supabase-realtime:4000/socket
    protocol: ws
    routes:
      - name: realtime-ws
        strip_path: true
        paths:
          - /realtime/v1/

  - name: realtime-v1-rest
    url: http://realtime-dev.supabase-realtime:4000/api
    routes:
      - name: realtime-rest
        strip_path: true
        paths:
          - /realtime/v1/api

  - name: studio
    url: http://studio:3000/
    routes:
      - name: studio
        strip_path: false
        regex_priority: 0
        paths:
          - /
    plugins:
      - name: cors
      - name: basic-auth
        config:
          hide_credentials: true

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
        - apikey
        - x-client-info
      credentials: true
