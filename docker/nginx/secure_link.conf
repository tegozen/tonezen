# Signed download endpoint — md5 hash verified by nginx secure_link module
# URL format: /download/{path}?md5={base64url_hmac}&expires={unix_ts}

map $arg_md5 $md5_valid {
    default 0;
    "~.+" 1;
}

server {
    listen 80;
    server_name _;

    location /download/ {
        secure_link $arg_md5,$arg_expires;
        secure_link_md5 "$secure_link_expires$uri $download_secret";

        if ($secure_link = "") {
            return 403;
        }

        if ($secure_link = "0") {
            return 410;
        }

        alias /content/;
        # Strip /download/ prefix — request /download/cycles/foo.mp3 -> /content/cycles/foo.mp3
    }

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}

# Secret injected at container start via envsubst in entrypoint if needed.
# For dev, set in docker-compose env and use lua or include — simplified: use fixed secret file.
env DOWNLOAD_URL_SECRET;
