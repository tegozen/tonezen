<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Сброс пароля · Tonezen</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="reset-page-body">
    <header class="site-header" aria-label="Главная навигация">
      <a class="brand" href="/" aria-label="Tonezen">
        <img class="brand-icon" src="/assets/app-icon.png" alt="" aria-hidden="true" />
        <span>Tonezen</span>
      </a>
    </header>

    <main class="reset-main">
      <section class="reset-panel" aria-labelledby="reset-title">
        <h1 id="reset-title">Новый пароль</h1>
        <p class="reset-copy">
          Введите новый пароль для аккаунта Tonezen. После сохранения вернитесь в приложение и войдите снова.
        </p>
        <form class="reset-form" id="reset-form">
          <label>
            <span>Новый пароль</span>
            <input id="password" type="password" minlength="12" autocomplete="new-password" required />
          </label>
          <label>
            <span>Повторите пароль</span>
            <input id="confirm-password" type="password" minlength="12" autocomplete="new-password" required />
          </label>
          <p class="reset-message" id="reset-message" role="status"></p>
          <button class="primary-button" type="submit">Сохранить новый пароль</button>
        </form>
      </section>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
      const accessToken = hash.get("access_token") || params.get("access_token") || "";
      const form = document.getElementById("reset-form");
      const message = document.getElementById("reset-message");
      const password = document.getElementById("password");
      const confirmPassword = document.getElementById("confirm-password");

      function setMessage(text, error = false) {
        message.textContent = text;
        message.dataset.error = error ? "true" : "false";
      }

      if (!accessToken) {
        setMessage("Ссылка для сброса пароля недействительна или устарела.", true);
        form.querySelector("button").disabled = true;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (password.value.length < 12) {
          setMessage("Пароль должен быть не короче 12 символов.", true);
          return;
        }
        if (password.value !== confirmPassword.value) {
          setMessage("Пароли не совпадают.", true);
          return;
        }

        form.querySelector("button").disabled = true;
        setMessage("Сохраняем новый пароль...");
        try {
          const response = await fetch("/api/v1/auth/password/update", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              access_token: accessToken,
              password: password.value,
            }),
          });
          if (!response.ok) {
            throw new Error("reset failed");
          }
          password.value = "";
          confirmPassword.value = "";
          setMessage("Пароль обновлён. Теперь можно вернуться в приложение и войти.");
        } catch {
          form.querySelector("button").disabled = false;
          setMessage("Не удалось сохранить пароль. Запросите новую ссылку и попробуйте ещё раз.", true);
        }
      });
    </script>
  </body>
</html>
